
name: BMC PASS - Foundry Tests

on:
  push:
    branches:
      - main
      - security/vrf-recovery
      - feature/deterministic-pass
  pull_request:
  workflow_dispatch:


jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check Foundry version
        run: forge --version
      - name: Compile contracts
        run: forge build --sizes

      - name: Run Solidity tests
        run: forge test -vvv --no-match-contract 'BMCMainnetForkTest|BMCDeterministicMainnetForkTest'

      
- name: Simulate deterministic Mainnet deployment
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::error::MAINNET_RPC_URL missing"
            exit 1
          fi

          forge script \
            script/DeployBMCIlluminatiPassDeterministicMainnet.s.sol:DeployBMCIlluminatiPassDeterministicMainnet \
            --fork-url "$MAINNET_RPC_URL" \
            -vvvv
