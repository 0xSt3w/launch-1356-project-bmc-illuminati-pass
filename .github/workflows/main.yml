
name: BMC PASS - Foundry Tests

on:
  push:
    branches:
      - main
      - security/vrf-recovery
      - feature/deterministic-pass
  pull_request:
  workflow_dispatch:


jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check Foundry version
        run: forge --version
      - name: Compile contracts
        run: forge build --sizes

      - name: Run Solidity tests
        run: forge test -vvv --no-match-contract BMCMainnetForkTest

      - name: Test real BMC on Ethereum fork
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          forge test \
            --match-contract BMCMainnetForkTest \
            --fork-url "$MAINNET_RPC_URL" \
            -vvv
