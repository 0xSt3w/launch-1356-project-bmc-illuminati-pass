
      - name: Simulate BMC PASS V3 deployment (no broadcast)
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          OWNER: "0x000000000000000000000000000000000000dEaD"
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::error::MAINNET_RPC_URL is not configured"
            exit 1
          fi

          forge script \
            script/DeployBMCIlluminatiPassV3DryRun.s.sol:DeployBMCIlluminatiPassV3DryRun \
            --fork-url "$MAINNET_RPC_URL" \
            -vvvv
